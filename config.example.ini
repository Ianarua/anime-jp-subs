# 把这个文件复制成 config.ini（放在脚本同目录）就能生效；
# 也可以用环境变量 ANIME_JP_SUB_CONFIG 指向别处的配置文件。
#
# 【全部都可以不写】——不写就按 环境变量 → config.ini → 系统 PATH → 项目 tools\ 的顺序自动找。
# 只有"装在奇怪地方"或想固定版本时才需要配。

[paths]
# 外部程序（装了但不在 PATH 里的时候写这里）
# ffmpeg      = C:\ffmpeg\bin\ffmpeg.exe
# ffprobe     = C:\ffmpeg\bin\ffprobe.exe
# mkvmerge    = C:\Program Files\MKVToolNix\mkvmerge.exe
# mkvpropedit = C:\Program Files\MKVToolNix\mkvpropedit.exe

# whisper 模型目录（放 large-v3 那 5 个文件的目录）
# model_dir   = D:\models\large-v3

# 自动下载的外部程序放哪（默认项目目录下的 tools\；只在缺 ffmpeg/MKVToolNix 时会用到）
# tools_dir   = D:\anime-jp-sub-tools

# 运行日志放哪（默认写在"被扫描的目录"下，叫 anime_jp_sub.log）
# log_dir     = D:\logs

# 对应的环境变量（优先级比这个文件高）：
#   ANIME_JP_SUB_FFMPEG / _FFPROBE / _MKVMERGE / _MKVPROPEDIT / _MODEL_DIR / _TOOLS_DIR
#   ANIME_JP_SUB_FONT  —— 换注音用的字体文件（默认用随项目的 fonts\MPLUS1Code-VF.ttf）
#   ANIME_JP_SUB_LOG_DIR / ANIME_JP_SUB_NO_LOG=1（不开日志）


# 注音参数。不写就用代码里的默认值（1080p 下主字 60px、注音 = 主字 45%、底边距 50px）。
# 把这个文件复制到**某个番剧文件夹**里，就只影响那一个番剧。
[furigana]
# main_px   = 60     ; 主字幕字号（基准 1080p，实际按画面高度比例换算，换分辨率不会跑偏）
# bottom_px = 50     ; 主字幕底边距
# max_chars = 30     ; 每行最多几个字，超过就拆成前后相继的两条
