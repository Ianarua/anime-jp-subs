[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-jp-sub"
version = "0.2.0"
description = "给日语动画 mkv 自动生成带平假名注音的日语字幕并内封（不改动音视频）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["anime", "subtitle", "furigana", "japanese", "whisper"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "faster-whisper==1.2.1",
    "Janome==0.5.0",
    "pillow==12.3.0",
]

[project.scripts]
anime-jp-sub = "anime_jp_sub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anime_jp_sub = ["fonts/*.ttf", "qa/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
